<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Nos Casamos! - Sol & Brian</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="video-container">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="1000139816.mp4" type="video/mp4">
            Tu navegador no soporta videos.
        </video>
    </div>

    <div class="interface-container">
        
        <a href="https://wa.me/5493624388558?text=¡Hola!%20Quiero%20confirmar%20mi%20asistencia%20a%20la%20boda" 
           target="_blank" 
           class="btn btn-whatsapp">
            <i class="fab fa-whatsapp"></i> Confirmar por WhatsApp
        </a>

        <button onclick="copiarAlias()" class="btn btn-alias" id="btn-alias">
            <i class="far fa-copy"></i> Copiar Alias Bancario
        </button>
        
    </div>

    <script>
        function copiarAlias() {
            const alias = "sol.brian.boda";
            
            navigator.clipboard.writeText(alias).then(() => {
                const boton = document.getElementById('btn-alias');
                // Guardamos el contenido original
                const contenidoOriginal = boton.innerHTML;
                
                // Cambiamos el diseño temporalmente para avisar que se copió
                boton.innerHTML = '<i class="fas fa-check"></i> ¡Alias Copiado!';
                boton.style.background = '#4caf50';
                
                // Volvemos al estado normal después de 2 segundos
                setTimeout(() => {
                    boton.innerHTML = contenidoOriginal;
                    boton.style.background = '#ffffff';
                }, 2000);
            }).catch(err => {
                console.error('Error al copiar: ', err);
            });
        }
    </script>

</body>
</html>
